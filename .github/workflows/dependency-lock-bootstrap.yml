name: Dependency Lock Bootstrap

on:
  push:
    branches:
      - migrate-nextjs-frontend

permissions:
  contents: write

concurrency:
  group: dependency-lock-bootstrap
  cancel-in-progress: true

jobs:
  lock-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migrate-nextjs-frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate server lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit frontend
        working-directory: frontend
        shell: bash
        run: |
          npm audit --json > /tmp/frontend-audit.json || true
          node -e 'const a=require("/tmp/frontend-audit.json"); console.log(JSON.stringify(a.metadata?.vulnerabilities || {}, null, 2))'

      - name: Audit server
        working-directory: server
        shell: bash
        run: |
          npm audit --json > /tmp/server-audit.json || true
          node <<'NODE'
          const a = require("/tmp/server-audit.json");
          console.log("COUNTS", JSON.stringify(a.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(a.vulnerabilities || {})) {
            console.log("VULN", JSON.stringify({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              range: v.range,
              nodes: v.nodes,
              via: (v.via || []).map((x) => typeof x === "string" ? x : ({
                source: x.source,
                name: x.name,
                title: x.title,
                severity: x.severity,
                range: x.range,
                url: x.url
              })),
              fixAvailable: v.fixAvailable
            }));
          }
          NODE

      - name: Commit lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date"
            exit 0
          fi
          git commit -m "build: lock npm dependencies"
          git push origin HEAD:migrate-nextjs-frontend
